# Tierllama providers v2 (J10): add any OpenAI-compatible provider.
# Keys live in environment variables - NEVER in this file.
# tier_map: Jev difficulty -> model on that provider.
# NOTE: cost keys MUST stay above [provider.models] (TOML table-header rule).

[[provider]]
name = "openai"
base_url = "https://api.openai.com/v1"
api_key_env = "OPENAI_API_KEY"
enabled = false
cost_per_mtok_input = 2.50
cost_per_mtok_output = 10.00
[provider.models]
easy = "gpt-4o-mini"
medium = "gpt-4o"
hard = "o1"
expert = "o1"

[[provider]]
name = "xai"
base_url = "https://api.x.ai/v1"
api_key_env = "XAI_API_KEY"
enabled = false
cost_per_mtok_input = 3.00
cost_per_mtok_output = 15.00
[provider.models]
easy = "grok-3-mini"
medium = "grok-3"
hard = "grok-3"

# LOCAL Ollama: your own machine's models - never needs a key.
[[provider]]
name = "ollama-local"
base_url = "http://127.0.0.1:11434/v1"
api_key_env = "NONE"
enabled = true
cost_per_mtok_input = 0.0
cost_per_mtok_output = 0.0
[provider.models]

# Anthropic (Claude): OpenAI-SDK compatible endpoint; Sonnet 5 $2/$10, Haiku 4.5 $1/$5.
[[provider]]
name = "anthropic"
base_url = "https://api.anthropic.com/v1"
api_key_env = "ANTHROPIC_API_KEY"
enabled = false
cost_per_mtok_input = 2.00
cost_per_mtok_output = 10.00
[provider.models]
easy = "claude-haiku-4-5"
medium = "claude-sonnet-5"
hard = "claude-sonnet-5"
expert = "claude-opus-5"

# Google Gemini: official OpenAI-compatible endpoint (ai.google.dev/gemini-api/docs/openai).
[[provider]]
name = "gemini"
base_url = "https://generativelanguage.googleapis.com/v1beta/openai"
api_key_env = "GEMINI_API_KEY"
enabled = false
cost_per_mtok_input = 1.25
cost_per_mtok_output = 10.00
[provider.models]
easy = "gemini-2.5-flash"
medium = "gemini-2.5-flash"
hard = "gemini-2.5-pro"
expert = "gemini-2.5-pro"

# OpenRouter: one key -> 500+ models (OpenAI, Anthropic, Google, Meta, Mistral...).
# Passthrough pricing + ~5% fee; costs below are blended estimates (vary by model).
[[provider]]
name = "openrouter"
base_url = "https://openrouter.ai/api/v1"
api_key_env = "OPENROUTER_API_KEY"
enabled = false
cost_per_mtok_input = 1.00
cost_per_mtok_output = 3.00
[provider.models]
easy = "google/gemini-2.5-flash"
medium = "deepseek/deepseek-chat"
hard = "anthropic/claude-sonnet-5"
expert = "anthropic/claude-opus-5"

# Groq: ultra-fast LPU inference, Llama-family models, generous free tier.
[[provider]]
name = "groq"
base_url = "https://api.groq.com/openai/v1"
api_key_env = "GROQ_API_KEY"
enabled = false
cost_per_mtok_input = 0.59
cost_per_mtok_output = 0.79
[provider.models]
easy = "llama-3.1-8b-instant"
medium = "llama-3.3-70b-versatile"
hard = "llama-3.3-70b-versatile"
expert = "kimi-k2"

# DeepSeek: cheapest frontier-class API; V4 models, 1M context, cache discounts.
[[provider]]
name = "deepseek"
base_url = "https://api.deepseek.com/v1"
api_key_env = "DEEPSEEK_API_KEY"
enabled = false
cost_per_mtok_input = 0.14
cost_per_mtok_output = 0.28
[provider.models]
easy = "deepseek-chat"
medium = "deepseek-chat"
hard = "deepseek-reasoner"
expert = "deepseek-reasoner"

# Ollama CLOUD (ollama.com direct - no local install needed): requires a free
# API key from ollama.com. Gui's pushback: fresh users need this option.
[[provider]]
name = "ollama-cloud"
base_url = "https://ollama.com/v1"
api_key_env = "OLLAMA_API_KEY"
enabled = false
cost_per_mtok_input = 0.15
cost_per_mtok_output = 0.60
[provider.models]
easy = "glm-5.3-flash:cloud"
medium = "glm-5.3-flash:cloud"
hard = "kimi-k3:cloud"
expert = "kimi-k3:cloud"
